<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saymon Rahman — Connected Systems Engineer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%2300F5A0' opacity='.85'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700;800;900&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ CORE / TOKENS ============ */
:root{
  --bg:#050811; --ink:#F8FAFC; --mut:#94A3B8; --dim:#5b6b82;
  --mint:#00F5A0; --mint40:rgba(0,245,160,.4); --silver:#E2E8F0;
  --glass:rgba(15,23,42,.35); --glass2:rgba(15,23,42,.55); --line:rgba(255,255,255,.08);
  --disp:'Unbounded',sans-serif; --body:'Manrope',sans-serif; --mono:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:auto}
body{background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.modal-open{overflow:hidden}
::selection{background:rgba(0,245,160,.28);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#070b15}
::-webkit-scrollbar-thumb{background:rgba(0,245,160,.22);border-radius:99px;border:2px solid #070b15}
::-webkit-scrollbar-thumb:hover{background:rgba(0,245,160,.45)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid rgba(0,245,160,.6);outline-offset:3px;border-radius:4px}

/* ============ AMBIENT LAYERS ============ */
#amb{position:fixed;inset:0;z-index:0;pointer-events:none;mix-blend-mode:screen}
.grid-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.024) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.024) 1px,transparent 1px);
  background-size:54px 54px;
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 20%,transparent 78%);
  mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 20%,transparent 78%)}
#app{position:relative;z-index:1}

/* ============ BOOT ============ */
#boot{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .6s,visibility .6s}
#boot.done{opacity:0;visibility:hidden}
.boot-mk{font:800 2rem var(--disp);color:var(--mint);letter-spacing:.1em;position:relative;animation:bootPulse 1.1s ease-in-out infinite alternate}
.boot-mk::after{content:'';position:absolute;inset:-26px;border:1px solid rgba(0,245,160,.25);border-radius:50%;animation:rip 1.4s ease-out infinite}
@keyframes bootPulse{to{transform:scale(1.12);text-shadow:0 0 30px rgba(0,245,160,.7)}}

/* ============ CURSOR ============ */
#cr{position:fixed;left:0;top:0;z-index:999;pointer-events:none;display:none}
.crd{position:absolute;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px rgba(0,245,160,.9)}
.crr{position:absolute;width:30px;height:30px;margin:-15px;border-radius:50%;border:1.5px solid rgba(0,245,160,.35);
  background:radial-gradient(circle,rgba(0,245,160,.10),transparent 70%);
  transition:width .3s var(--ease),height .3s var(--ease),margin .3s var(--ease),border-color .3s,opacity .3s;opacity:.9}
#cr.on .crr{width:44px;height:44px;margin:-22px;border-color:rgba(0,245,160,.65)}
#cr.down .crr{width:22px;height:22px;margin:-11px}
.ripple{position:fixed;width:14px;height:14px;margin:-7px;border-radius:50%;border:1px solid rgba(0,245,160,.5);pointer-events:none;z-index:998;animation:rip .7s ease-out forwards}
@keyframes rip{to{transform:scale(6.5);opacity:0}}

/* ============ GLASS PRIMITIVES ============ */
.glass{background:var(--glass);backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);border:1px solid var(--line)}
.glass-lite{background:rgba(15,23,42,.28);backdrop-filter:blur(18px) saturate(130%);-webkit-backdrop-filter:blur(18px) saturate(130%);border:1px solid var(--line)}
.kick{font:600 11px/1 var(--mono);letter-spacing:.32em;color:var(--mint);display:flex;align-items:center;gap:.9rem;text-transform:uppercase}
.kick::before{content:'';width:34px;height:1px;background:linear-gradient(90deg,var(--mint),transparent)}
.mono{font-family:var(--mono)}
.wrap{max-width:1280px;margin:0 auto}
.sec{padding:7.5rem 6vw;position:relative;border-top:1px solid rgba(255,255,255,.045)}
.shead{display:flex;align-items:flex-end;justify-content:space-between;gap:2rem;margin-bottom:3.6rem;flex-wrap:wrap}
.shead h2{font:700 clamp(1.7rem,3.4vw,2.9rem)/1.1 var(--disp);letter-spacing:-.01em;margin-top:1rem}
.shead .idx{font:600 12px var(--mono);color:var(--dim);letter-spacing:.2em;border:1px solid var(--line);padding:.55rem .9rem;border-radius:99px;white-space:nowrap}
.shead .note{max-width:340px;color:var(--mut);font-size:.92rem}

/* reveal system */
[data-rev]{opacity:0;transform:translateY(30px);filter:blur(10px);transition:opacity .9s var(--ease),transform .9s var(--ease),filter .9s var(--ease);transition-delay:var(--d,0s)}
[data-rev].in{opacity:1;transform:none;filter:none}
[data-rev="clip"]{opacity:1;transform:none;filter:none;clip-path:inset(0 100% 0 0);transition:clip-path 1.1s cubic-bezier(.7,0,.2,1) var(--d,0s)}
[data-rev="clip"].in{clip-path:inset(-8% -4% -8% -4%)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:.6rem;padding:.95rem 1.8rem;border-radius:99px;font:700 .92rem var(--body);letter-spacing:.02em;border:1px solid transparent;cursor:pointer;transition:transform .35s var(--ease),box-shadow .35s var(--ease),background .3s,border-color .3s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-mint{background:linear-gradient(135deg,rgba(0,245,160,.95),rgba(0,214,140,.75));color:#04170e;box-shadow:0 10px 34px rgba(0,245,160,.22),inset 0 1px 0 rgba(255,255,255,.45)}
.btn-mint:hover{transform:translateY(-3px);box-shadow:0 18px 46px rgba(0,245,160,.4),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-glass{background:rgba(255,255,255,.05);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-color:var(--line);color:var(--ink)}
.btn-glass:hover{transform:translateY(-3px);border-color:rgba(0,245,160,.4);background:rgba(0,245,160,.06)}
.btn.sm{padding:.55rem 1.1rem;font-size:.8rem}
.btn-danger{background:rgba(251,113,133,.08);border-color:rgba(251,113,133,.3);color:#FDA4AF}
.btn-danger:hover{background:rgba(251,113,133,.16)}

/* ============ TOPBAR (FIXED — anchored left/right, fully visible) ============ */
.topbar{position:fixed;top:14px;left:14px;right:14px;z-index:60;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:11px 20px;border-radius:99px;transition:all .5s var(--ease)}
.topbar.scrolled{padding:7px 18px;background:rgba(10,16,30,.62)}
.brand{display:flex;align-items:center;gap:.75rem}
.brand-mk{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font:800 .82rem var(--disp);color:#04170e;background:linear-gradient(135deg,#00F5A0,#00c78a);box-shadow:0 4px 18px rgba(0,245,160,.35)}
.brand-tx{font:600 10px var(--mono);letter-spacing:.26em;color:var(--mut)}
.tnav{display:flex;gap:.3rem}
.tnav a{font:600 .82rem var(--body);color:var(--mut);padding:.5rem .95rem;border-radius:99px;transition:.3s;position:relative}
.tnav a:hover{color:var(--ink);background:rgba(255,255,255,.05)}
.tnav a.act{color:var(--ink);background:rgba(0,245,160,.09)}
.tnav a.act::after{content:'';position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint)}
.tright{display:flex;align-items:center;gap:.8rem}
.tstatus{display:flex;align-items:center;gap:.5rem;font:600 10px var(--mono);letter-spacing:.2em;color:var(--mut);border:1px solid var(--line);padding:.5rem .9rem;border-radius:99px}
.tstatus .dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint);animation:blink 2.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.adm-link{font:600 11px var(--mono);letter-spacing:.1em;color:var(--mut);border:1px dashed rgba(255,255,255,.16);padding:.5rem .9rem;border-radius:99px;transition:.3s}
.adm-link:hover{color:var(--mint);border-color:rgba(0,245,160,.5)}

/* ============ HERO ============ */
.hero{min-height:100svh;display:grid;grid-template-columns:1.12fr .88fr;gap:3rem;align-items:center;padding:130px 6vw 90px;max-width:1400px;margin:0 auto;position:relative}
.h-giant{font:800 clamp(2.7rem,7.4vw,6.2rem)/0.98 var(--disp);letter-spacing:-.015em;margin:1.4rem 0 1.2rem;text-transform:uppercase}
.h-giant .ln{display:block}
.h-giant .outline{color:transparent;-webkit-text-stroke:1.5px rgba(226,232,240,.85)}
.typeline{font:500 clamp(.9rem,1.4vw,1.05rem) var(--mono);color:var(--silver);display:flex;gap:.6rem;align-items:center;min-height:1.8em}
.tl-prompt{color:var(--mint)}
.caret{width:9px;height:1.15em;background:var(--mint);box-shadow:0 0 12px rgba(0,245,160,.7);animation:blink 1s steps(1) infinite;flex:none}
.bio{color:var(--mut);max-width:560px;margin:1.5rem 0 1.8rem;font-size:1.02rem;font-weight:500}

/* terminal widget */
.term{max-width:540px;border-radius:16px;overflow:hidden;margin-bottom:2rem;position:relative}
.term::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.012) 3px 4px)}
.term-hd{display:flex;align-items:center;gap:6px;padding:.7rem 1rem;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
.tdot{width:9px;height:9px;border-radius:50%;background:rgba(148,163,184,.35)}
.tdot:first-child{background:rgba(0,245,160,.55)}
.term-hd em{font:500 10.5px var(--mono);color:var(--dim);margin-left:.6rem;letter-spacing:.08em;font-style:normal}
.term-bd{padding:1rem 1.2rem;font:500 12.5px/2 var(--mono)}
.trow b{color:var(--mint);font-weight:600}
.trow s{color:var(--dim);text-decoration:none;margin:0 .5em}
.trow u{color:var(--silver);text-decoration:none}
.tin{color:var(--dim);display:flex;align-items:center;gap:.6rem}

.cta-row{display:flex;gap:1rem;flex-wrap:wrap;align-items:center}

/* hero right / orb */
.h-right{display:flex;justify-content:center}
.orb{position:relative;width:min(400px,80%);aspect-ratio:1}
.blob{position:absolute;inset:8%;overflow:hidden;cursor:pointer;
  border-radius:44% 56% 58% 42%/46% 42% 58% 54%;
  animation:blobMorph 11s ease-in-out infinite alternate;
  box-shadow:inset 0 0 60px rgba(0,245,160,.07),0 30px 80px rgba(0,0,0,.55);
  border:1px solid rgba(0,245,160,.22);background:rgba(15,23,42,.4);transition:transform .2s ease-out}
@keyframes blobMorph{
  0%{border-radius:44% 56% 58% 42%/46% 42% 58% 54%}
  50%{border-radius:58% 42% 40% 60%/52% 58% 42% 48%}
  100%{border-radius:40% 60% 55% 45%/58% 46% 54% 42%}}
.blob img{width:100%;height:100%;object-fit:cover;filter:saturate(.92) contrast(1.05)}
.mono-fallback{width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,rgba(0,245,160,.16),transparent 55%),radial-gradient(circle at 70% 80%,rgba(226,232,240,.1),transparent 50%),#0a1120}
.mono-fallback span{font:800 clamp(3rem,7vw,5rem) var(--disp);color:transparent;-webkit-text-stroke:1.5px rgba(0,245,160,.6)}
.blob::after{content:'';position:absolute;inset:0;background:radial-gradient(320px at var(--mx,50%) var(--my,30%),rgba(255,255,255,.14),transparent 60%);mix-blend-mode:screen;pointer-events:none}
.orb-ring{position:absolute;inset:-2%;border-radius:50%;border:1px dashed rgba(0,245,160,.28);animation:spin 26s linear infinite}
.orb-ring::before{content:'';position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 14px var(--mint)}
@keyframes spin{to{transform:rotate(360deg)}}
.orb .chip{position:absolute;font:600 10px var(--mono);letter-spacing:.18em;padding:.55rem .95rem;border-radius:99px;animation:floaty 6s ease-in-out infinite;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.orb .c1{top:4%;right:-6%;animation-delay:0s}
.orb .c2{bottom:16%;left:-13%;animation-delay:1.4s}
.orb .c3{bottom:-4%;right:6%;animation-delay:2.6s}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
.orb-pulse{position:absolute;inset:20%;border-radius:50%;border:1px solid rgba(0,245,160,.16);animation:orbPulse 3.4s ease-out infinite}
@keyframes orbPulse{0%{transform:scale(.8);opacity:.8}100%{transform:scale(1.5);opacity:0}}
.scroll-hint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font:600 9.5px var(--mono);letter-spacing:.34em;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:.7rem}
.scroll-hint::after{content:'';width:1px;height:44px;background:linear-gradient(180deg,var(--mint),transparent);animation:drip 2s var(--ease) infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}55%{transform:scaleY(1);transform-origin:top}56%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ============ TICKER ============ */
.tick{border-block:1px solid var(--line);overflow:hidden;padding:1.05rem 0;background:rgba(255,255,255,.012)}
.tick-in{display:flex;gap:3.2rem;width:max-content;animation:tick 30s linear infinite;font:600 11px var(--mono);letter-spacing:.26em;color:var(--mut)}
.tick-in span{display:flex;align-items:center;gap:3.2rem;white-space:nowrap}
.tick-in i{color:var(--mint);font-style:normal;font-size:8px}
.tick:hover .tick-in{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-50%)}}

/* ============ METRICS ============ */
.mwrap{display:grid;grid-template-columns:1.05fr 1.6fr;gap:1.4rem}
.edu{border-radius:22px 22px 22px 6px;padding:2.4rem;position:relative;overflow:hidden}
.edu::before{content:'';position:absolute;top:-70px;right:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(0,245,160,.12),transparent 70%)}
.edu-stage{font:600 10.5px var(--mono);letter-spacing:.24em;color:var(--mint);display:inline-flex;align-items:center;gap:.6rem;border:1px solid rgba(0,245,160,.3);padding:.5rem .9rem;border-radius:99px;background:rgba(0,245,160,.06)}
.edu h3{font:700 clamp(1.15rem,1.9vw,1.5rem)/1.3 var(--disp);margin:1.4rem 0 .5rem}
.edu-inst{color:var(--silver);font-weight:600;margin-bottom:1rem}
.edu p{color:var(--mut);font-size:.94rem}
.edu-tags{display:flex;gap:.6rem;margin-top:1.6rem;flex-wrap:wrap}
.edu-tags span{font:600 9.5px var(--mono);letter-spacing:.18em;color:var(--mut);border:1px solid var(--line);padding:.4rem .7rem;border-radius:6px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
.mcell{border-radius:18px;padding:1.9rem 1.7rem;position:relative;overflow:hidden;transition:transform .4s var(--ease),border-color .4s}
.mcell:hover{transform:translateY(-5px);border-color:rgba(0,245,160,.35)}
.mcell::after{content:'';position:absolute;inset:0;background:radial-gradient(280px at var(--mx,50%) var(--my,50%),rgba(0,245,160,.07),transparent 60%);opacity:0;transition:opacity .4s}
.mcell:hover::after{opacity:1}
.mval{font:800 clamp(2rem,3.4vw,2.9rem)/1 var(--disp);color:var(--ink)}
.mval i{font:600 .9rem var(--mono);color:var(--mint);font-style:normal;margin-left:.3rem}
.mlabel{font-weight:700;margin-top:.9rem}
.msub{color:var(--dim);font-size:.82rem;margin-top:.15rem}

/* ============ SKILLS ============ */
.tabs{display:inline-flex;gap:2px;padding:5px;border-radius:99px;position:relative;margin-bottom:2.8rem;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-ind{position:absolute;top:5px;bottom:5px;left:0;border-radius:99px;background:rgba(0,245,160,.1);border:1px solid rgba(0,245,160,.4);box-shadow:0 0 22px rgba(0,245,160,.18),inset 0 0 12px rgba(0,245,160,.08);transition:transform .55s cubic-bezier(.3,1.4,.4,1),width .55s cubic-bezier(.3,1.4,.4,1);pointer-events:none}
.tab{position:relative;z-index:1;background:none;border:0;cursor:pointer;padding:.68rem 1.25rem;border-radius:99px;font:700 11px var(--mono);letter-spacing:.14em;color:var(--mut);white-space:nowrap;transition:color .3s}
.tab:hover{color:var(--ink)}
.tab.act{color:var(--mint)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:1.4rem}
.scol{border-radius:18px;padding:1.8rem;animation:pop .55s var(--ease)}
.scol.hide{display:none}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}}
.scol-hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:1rem;margin-bottom:1.3rem}
.scol-hd b{font:700 .95rem var(--disp);letter-spacing:.02em}
.scol-hd span{font:600 9.5px var(--mono);letter-spacing:.2em;color:var(--dim)}
.skill{margin-bottom:1.15rem}
.skill:last-child{margin-bottom:0}
.sk-top{display:flex;justify-content:space-between;font-size:.86rem;font-weight:600;margin-bottom:.45rem}
.sk-top em{font:600 11px var(--mono);color:var(--mint);font-style:normal}
.bar{height:5px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,rgba(0,245,160,.4),rgba(0,245,160,.95));box-shadow:0 0 14px rgba(0,245,160,.4);transition:width 1.3s var(--ease)}

/* ============ PROJECTS ============ */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem}
.pcard{border-radius:20px;overflow:hidden;cursor:pointer;position:relative;transition:transform .25s ease-out,border-color .4s,box-shadow .4s;display:flex;flex-direction:column}
.pcard:hover{border-color:rgba(0,245,160,.4);box-shadow:0 26px 60px rgba(0,0,0,.5)}
.pcard::after{content:'';position:absolute;inset:0;background:radial-gradient(430px at var(--mx,50%) var(--my,50%),rgba(0,245,160,.09),transparent 62%);opacity:0;transition:opacity .4s;pointer-events:none}
.pcard:hover::after{opacity:1}
.pcv-wrap{aspect-ratio:16/9.5;overflow:hidden;position:relative;border-bottom:1px solid var(--line)}
.pcv{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1s var(--ease)}
.pcard:hover .pcv{transform:scale(1.06)}
.pcv-num{position:absolute;top:12px;right:16px;font:700 11px var(--mono);letter-spacing:.2em;color:var(--mint);background:rgba(5,8,17,.6);backdrop-filter:blur(8px);padding:.35rem .7rem;border-radius:99px;border:1px solid rgba(0,245,160,.25)}
.pbody{padding:1.6rem;display:flex;flex-direction:column;gap:.7rem;flex:1}
.pbody h3{font:700 1.02rem/1.35 var(--disp);letter-spacing:.01em}
.pbody p{color:var(--mut);font-size:.9rem;flex:1}
.ptags{display:flex;gap:.45rem;flex-wrap:wrap}
.ptags span{font:600 9.5px var(--mono);letter-spacing:.1em;color:var(--silver);background:rgba(255,255,255,.05);border:1px solid var(--line);padding:.32rem .6rem;border-radius:6px}
.pfoot{display:flex;justify-content:space-between;align-items:center;padding-top:.9rem;border-top:1px solid var(--line)}
.plink{font:700 11px var(--mono);letter-spacing:.16em;color:var(--mint)}
.plink i{font-style:normal;display:inline-block;transition:transform .3s}
.pcard:hover .plink i{transform:translate(3px,-3px)}
.pcard.feat{grid-column:span 2;display:grid;grid-template-columns:1.12fr 1fr}
.pcard.feat .pcv-wrap{aspect-ratio:auto;height:100%;border-bottom:0;border-right:1px solid var(--line)}
.pcard.feat .pbody{padding:2.3rem;justify-content:center}
.pcard.feat h3{font-size:clamp(1.15rem,1.9vw,1.55rem)}

/* ============ LABS (sticky two-column) ============ */
.labs{display:grid;grid-template-columns:.85fr 1.35fr;gap:4.5rem;align-items:start}
.labs-left{position:sticky;top:120px}
.labs-left p{color:var(--mut);margin-top:1.2rem;max-width:360px}
.radar{margin-top:2.4rem;width:150px;height:150px;border-radius:50%;border:1px solid rgba(0,245,160,.2);position:relative;background:radial-gradient(circle,rgba(0,245,160,.05),transparent 70%)}

/* ---------- file helpers ---------- */
function readImage(file,max,cb){
 if(!file||!file.type.startsWith('image/'))return toast('Please drop an image file','err');
 const r=new FileReader();
 r.onload=e=>{const img=new Image();
  img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));
   const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.86))};
  img.src=e.target.result};
 r.readAsDataURL(file);
}
function readPDF(file,cb){
 if(file.size>3e6)return toast('PDF too large for local storage (max ~3MB)','err');
 const r=new FileReader();r.onload=e=>cb({name:file.name,data:e.target.result});r.readAsDataURL(file);
}
function bindDrop(el,onFile){
 if(!el)return;const inp=$('input[type=file]',el);
 el.addEventListener('click',()=>inp&&inp.click());
 if(inp)inp.addEventListener('change',()=>onFile(inp.files[0]));
 el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('over')});
 el.addEventListener('dragleave',()=>el.classList.remove('over'));
 el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('over');onFile(e.dataTransfer.files[0])});
}

/* ---------- ambient fluid canvas (always on) ---------- */
(function initAmbient(){
 const cv=$('#amb'),ctx=cv.getContext('2d');let w,h;
 const size=()=>{w=cv.width=innerWidth;h=cv.height=innerHeight};size();
 addEventListener('resize',size);
 const cols=['0,245,160','226,232,240','0,245,160','148,163,184','0,245,160'];
 const blobs=cols.map((c,i)=>({c,a:.05+(i%3)*.018,r:.26+Math.random()*.28,x:.15+Math.random()*.7,y:.1+Math.random()*.8,sp:.4+Math.random()*.6,p:Math.random()*6.28}));
 let px=.5,py=.35;addEventListener('pointermove',e=>{px=e.clientX/innerWidth;py=e.clientY/innerHeight},{passive:true});
 function draw(now){
  const tt=now*.0001;ctx.clearRect(0,0,w,h);
  blobs.forEach((b,i)=>{
   const bx=b.x*w+Math.sin(tt*b.sp+b.p)*w*.14+(px-.5)*w*.05*(i%2?1:-1);
   const by=b.y*h+Math.cos(tt*b.sp*.8+b.p)*h*.12+(py-.5)*h*.05;
   const r=b.r*Math.min(w,h)*(1+.12*Math.sin(tt*1.4+b.p));
   const g=ctx.createRadialGradient(bx,by,0,bx,by,r);
   g.addColorStop(0,'rgba('+b.c+','+b.a+')');g.addColorStop(1,'rgba('+b.c+',0)');
   ctx.fillStyle=g;ctx.beginPath();ctx.arc(bx,by,r,0,6.29);ctx.fill();
  });
  if(!RM)requestAnimationFrame(draw);
 }
 requestAnimationFrame(draw);
})();

(function initCursor(){
 if(TOUCH)return;
 const cr=$('#cr');cr.style.display='block';
 const dot=$('.crd',cr),ring=$('.crr',cr);
 let mx=innerWidth/2,my=innerHeight/2,dx=mx,dy=my,rx=mx,ry=my;
 addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY},{passive:true});
 document.addEventListener('mouseover',e=>{
  cr.classList.toggle('on',!!e.target.closest('a,button,.tilt,input,textarea,select,summary,label,[data-cur]'))},{passive:true});
 addEventListener('pointerdown',()=>cr.classList.add('down'));
 addEventListener('pointerup',()=>cr.classList.remove('down'));
 document.addEventListener('click',e=>{
  const r=document.createElement('span');r.className='ripple';
  r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';
  document.body.appendChild(r);setTimeout(()=>r.remove(),720)},{passive:true});
 (function loop(){
  dx=lerp(dx,mx,.4);dy=lerp(dy,my,.4);rx=lerp(rx,mx,.15);ry=lerp(ry,my,.15);
  cr.style.transform='translate3d('+dx+'px,'+dy+'px,0)';
  ring.style.transform='translate3d('+(rx-dx)+'px,'+(ry-dy)+'px,0)';
  requestAnimationFrame(loop);
 })();
})();

/* ---------- public effects ---------- */
function initSite(){
 /* smooth kinetic scroll */
 if(!RM&&!TOUCH){
  let target=window.scrollY,cur=target,raf=null;
  const max=()=>document.documentElement.scrollHeight-innerHeight;
  const kick=()=>{if(!raf)raf=requestAnimationFrame(loop)};
  function loop(){
   cur+=(target-cur)*.085;
   if(Math.abs(target-cur)<.5){cur=target;window.scrollTo(0,cur);raf=null;return}
   window.scrollTo(0,cur);raf=requestAnimationFrame(loop);
  }
  const onWheel=e=>{if(document.body.classList.contains('modal-open'))return;e.preventDefault();target=clamp(target+e.deltaY,0,max());kick()};
  const onScroll=()=>{if(Math.abs(window.scrollY-cur)>3){cur=target=window.scrollY}};
  addEventListener('wheel',onWheel,{passive:false});
  addEventListener('scroll',onScroll,{passive:true});
  SCROLL.to=y=>{target=clamp(y,0,max());kick()};
  SCROLL.sync=()=>{cur=target=window.scrollY};
  FX.push(()=>{removeEventListener('wheel',onWheel);removeEventListener('scroll',onScroll);cancelAnimationFrame(raf)});
 }
 /* anchor interception */
 $$('a[data-scroll],[data-scroll]').forEach(a=>a.addEventListener('click',e=>{
  const sel=a.getAttribute('href');if(!sel||!sel.startsWith('#'))return;
  const el=$(sel);if(!el)return;e.preventDefault();
  SCROLL.to(el.getBoundingClientRect().top+window.scrollY-92);
 }));
 /* topbar shrink + scrollspy */
 const tb=$('.topbar'),links=$$('.tnav a');
 const secs=['skills','projects','labs','contact'].map(id=>$('#'+id)).filter(Boolean);
 const onScr=()=>{
  const y=window.scrollY;
  if(tb)tb.classList.toggle('scrolled',y>40);
  let act=null;secs.forEach(s=>{if(s.getBoundingClientRect().top<innerHeight*.4)act=s.id});
  links.forEach(l=>l.classList.toggle('act',l.getAttribute('href')==='#'+act));
 };
 addEventListener('scroll',onScr,{passive:true});onScr();
 FX.push(()=>removeEventListener('scroll',onScr));
 /* reveal */
 const io=new IntersectionObserver(es=>es.forEach(en=>{
  if(!en.isIntersecting)return;
  en.target.classList.add('in');io.unobserve(en.target);
  $$('.bar i',en.target).forEach(b=>b.style.width=b.dataset.w+'%');
  $$('[data-count]',en.target).forEach(runCount);
 }),{threshold:.14});
 $$('[data-rev]').forEach(el=>io.observe(el));
 FX.push(()=>io.disconnect());
 /* typing */
 const te=$('#type');
 if(te&&DB.typing.length){
  const lines=DB.typing;let li=0,ci=0,del=false;
  (function step(){
   if(!document.contains(te))return;
   const line=lines[li];
   if(!del){ci++;if(ci>=line.length){del=true;te.textContent=line;setTimeout(step,2100);return}}
   else{ci--;if(ci<=0){del=false;li=(li+1)%lines.length}}
   te.textContent=line.slice(0,ci);setTimeout(step,del?20:46);
  })();
 }
 /* tabs */
 const tabsW=$('#skillTabs');
 if(tabsW){
  const ind=$('.tab-ind',tabsW),tabs=$$('.tab',tabsW),grid=$('#skillGrid');
  const place=el=>{ind.style.width=el.offsetWidth+'px';ind.style.transform='translateX('+el.offsetLeft+'px)'};
  const re=()=>place($('.tab.act',tabsW));
  requestAnimationFrame(re);addEventListener('load',re);addEventListener('resize',re);
  tabs.forEach(tb=>tb.addEventListener('click',()=>{
   tabs.forEach(x=>x.classList.remove('act'));tb.classList.add('act');place(tb);
   const cat=tb.dataset.cat;
   $$('.scol',grid).forEach(g=>g.classList.toggle('hide',!(cat==='all'||g.dataset.cat===cat)));
  }));
 }
 /* tilt */
 if(!TOUCH&&!RM)$$('.tilt').forEach(c=>{
  c.addEventListener('pointermove',e=>{
   const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
   c.style.transform='perspective(900px) rotateY('+(x*7)+'deg) rotateX('+(-y*7)+'deg) translateY(-4px)';
   c.style.setProperty('--mx',(x*100+50)+'%');c.style.setProperty('--my',(y*100+50)+'%');
  });
  c.addEventListener('pointerleave',()=>{c.style.transform=''});
 });
 /* project modal */
 $$('.pcard').forEach(c=>c.addEventListener('click',()=>openProject(+c.dataset.i)));
 const modal=$('#modal');
 $$('[data-close]',modal).forEach(x=>x.addEventListener('click',closeModal));
 const onKey=e=>{if(e.key==='Escape')closeModal()};
 addEventListener('keydown',onKey);FX.push(()=>removeEventListener('keydown',onKey));
 /* CV fallback */
 const cvB=$('#cvBtn');
 if(cvB)cvB.addEventListener('click',e=>{e.preventDefault();toast('Resume not uploaded yet — add it in <b>Admin → System & Files</b>')});
 /* contact form → admin inbox */
 const form=$('#cform');
 if(form)form.addEventListener('submit',e=>{
  e.preventDefault();
  const d=new FormData(form);
  DB.inbox.unshift({id:uid(),name:d.get('name'),email:d.get('email'),subject:d.get('subject')||'(no subject)',msg:d.get('msg'),d:new Date().toISOString(),read:false});
  save();form.reset();
  const b=$('button',form),old=b.innerHTML;
  b.innerHTML='✓ TRANSMITTED';b.disabled=true;b.style.opacity=.85;
  setTimeout(()=>{b.innerHTML=old;b.disabled=false;b.style.opacity=1},2600);
  toast('Message transmitted to the admin console');
 });
 /* deep-link anchor */
 if(location.hash&&location.hash.length>2&&!location.hash.startsWith('#/')){
  const el=$(location.hash);
  if(el)setTimeout(()=>SCROLL.to(el.getBoundingClientRect().top+window.scrollY-92),150);
 }
}
function runCount(el){
 if(el.dataset.done)return;el.dataset.done=1;
 const end=parseFloat(el.dataset.count)||0,dec=+el.dataset.dec||0,dur=1400,st=performance.now();
 (function f(n){const p=clamp((n-st)/dur,0,1),e=1-Math.pow(1-p,3);
  el.textContent=(end*e).toFixed(dec);
  if(p<1)requestAnimationFrame(f)})(st);
}

  m[el.dataset.f]=el.dataset.f==='v'?(parseFloat(el.value)||0):el.value;qsave();
 }));
}

/* ---- hero & identity ---- */
function pHero(){
 $('#panel').innerHTML=
 '<div class="acard"><div class="acard-hd"><h3>Profile Photo</h3><span class="hsub">RENDERS IN THE HERO LIQUID FRAME</span></div>'
 +'<div class="prevRow" style="margin-bottom:1.1rem" id="phPrev">'+(DB.photo?'<img src="'+DB.photo+'" alt="">':'<span class="mono" style="font-size:10px;color:var(--dim)">NO PHOTO — MONOGRAM FALLBACK ACTIVE</span>')+'</div>'
 +'<div class="drop" id="phDrop"><input type="file" accept="image/*" hidden><div class="drop-ic">⇪</div><div>Drag & drop or click to upload</div><span class="mono">AUTO-COMPRESSED · JPG · MAX 800PX</span></div>'
 +(DB.photo?'<button class="btn btn-danger sm" id="phRm" style="margin-top:1rem">REMOVE PHOTO</button>':'')
 +'</div>'
 +'<div class="acard"><div class="acard-hd"><h3>Typing Lines</h3><button class="btn btn-glass sm" id="tyAdd">+ ADD LINE</button></div>'
 +DB.typing.map((l,i)=>'<div class="arow" style="margin-bottom:.7rem"><input type="text" data-ty="'+i+'" value="'+esc(l)+'"><button class="icoBtn del" data-tyd="'+i+'">✕</button></div>').join('')
 +'</div>'
 +'<div class="acard"><div class="acard-hd"><h3>Terminal Rows</h3><button class="btn btn-glass sm" id="tmAdd">+ ADD ROW</button></div>'
 +DB.terminal.map((r,i)=>'<div class="arow" style="margin-bottom:.7rem"><input type="text" style="max-width:200px" data-tm="'+i+'" data-f="0" value="'+esc(r[0])+'" placeholder="key"><input type="text" data-tm="'+i+'" data-f="1" value="'+esc(r[1])+'" placeholder="value"><button class="icoBtn del" data-tmd="'+i+'">✕</button></div>').join('')
 +'</div>';
 bindDrop($('#phDrop'),f=>readImage(f,800,d=>{DB.photo=d;save();toast('Profile photo updated');pHero()}));
 const rm=$('#phRm');if(rm)rm.addEventListener('click',()=>{DB.photo=null;save();pHero()});
 $$('input[data-ty]').forEach(el=>el.addEventListener('input',()=>{DB.typing[+el.dataset.ty]=el.value;qsave()}));
 $$('[data-tyd]').forEach(b=>b.addEventListener('click',()=>{DB.typing.splice(+b.dataset.tyd,1);save();pHero()}));
 $('#tyAdd').addEventListener('click',()=>{DB.typing.push('New headline line');save();pHero()});
 $$('input[data-tm]').forEach(el=>el.addEventListener('input',()=>{DB.terminal[+el.dataset.tm][+el.dataset.f]=el.value;qsave()}));
 $$('[data-tmd]').forEach(b=>b.addEventListener('click',()=>{DB.terminal.splice(+b.dataset.tmd,1);save();pHero()}));
 $('#tmAdd').addEventListener('click',()=>{DB.terminal.push(['KEY','VALUE']);save();pHero()});
}

/* ---- projects engine ---- */
function pProjects(){
 const rows=DB.projects.map((p,i)=>{
  const open=AP.exp===p.id?' open':'';
  return '<div class="projRow'+open+'" data-id="'+p.id+'">'
  +'<div class="projHd"><span class="grip">⠿</span><span class="mono" style="font-size:10px;color:var(--mint)">0'+(i+1)+'</span><h4>'+esc(p.title)+'</h4>'
  +'<div class="ctrls">'
   +'<button class="icoBtn" data-mv="-1" title="Move up">↑</button><button class="icoBtn" data-mv="1" title="Move down">↓</button>'
   +'<button class="icoBtn del" data-del title="Delete">✕</button></div></div>'
  +'<div class="projBd">'
   +'<label class="frow"><span>TITLE</span><input data-f="title" value="'+esc(p.title)+'"></label>'
   +'<label class="frow"><span>TAGLINE</span><input data-f="tagline" value="'+esc(p.tagline)+'"></label>'
   +'<label class="frow"><span>CARD DESCRIPTION</span><textarea data-f="desc" rows="2">'+esc(p.desc)+'</textarea></label>'
   +'<label class="frow"><span>LONG CASE STUDY <i class="fk">blank line = new paragraph</i></span><textarea data-f="long" rows="6">'+esc(p.long)+'</textarea></label>'
   +'<label class="frow"><span>TECH STACK <i class="fk">comma separated</i></span><input data-f="tech" value="'+esc(p.tech.join(', '))+'"></label>'
   +'<div class="twoCol">'
    +'<label class="frow"><span>DEMO LINK</span><input data-f="demo" value="'+esc(p.demo||'')+'" placeholder="https://…"></label>'
    +'<label class="frow"><span>REPO / LIVE LINK</span><input data-f="live" value="'+esc(p.live||'')+'" placeholder="https://…"></label>'
   +'</div>'
   +'<div class="prevRow">'+(p.img?'<img src="'+p.img+'" alt=""><button class="btn btn-danger sm" data-cvr>REMOVE COVER</button>':'<span class="mono" style="font-size:10px;color:var(--dim)">GENERATED COVER ACTIVE</span>')+'</div>'
   +'<div class="drop" style="padding:1.2rem"><input type="file" accept="image/*" hidden><span style="font-size:.86rem">⇪ Upload live cover photo</span><span class="mono">AUTO-COMPRESSED · MAX 1200PX</span></div>'
  +'</div></div>';
 }).join('');
 $('#panel').innerHTML='<div class="acard"><div class="acard-hd"><h3>'+DB.projects.length+' Systems</h3><button class="btn btn-mint sm" id="pjAdd">+ ADD PROJECT</button></div>'
  +'<div style="color:var(--dim);font-size:.82rem;margin-bottom:1.2rem">Click a header to expand · ↑↓ to reorder · changes save live</div>'
  +'<div style="display:flex;flex-direction:column;gap:1rem">'+rows+'</div></div>';
 $$('.projHd').forEach(hd=>hd.addEventListener('click',e=>{
  if(e.target.closest('button'))return;
  const row=hd.parentElement,id=row.dataset.id;
  AP.exp=AP.exp===id?null:id;
  $$('.projRow').forEach(r=>r.classList.toggle('open',r.dataset.id===AP.exp));
 }));
 $$('.projRow').forEach(row=>{
  const i=DB.projects.findIndex(x=>x.id===row.dataset.id);
  $$('input[data-f],textarea[data-f]',row).forEach(el=>el.addEventListener('input',()=>{
   const f=el.dataset.f;
   DB.projects[i][f]=f==='tech'?el.value.split(',').map(s=>s.trim()).filter(Boolean):el.value;
   qsave();
  }));
  bindDrop($('.drop',row),f=>readImage(f,1200,d=>{DB.projects[i].img=d;save();toast('Cover uploaded');pProjects()}));
  const cvr=$('[data-cvr]',row);if(cvr)cvr.addEventListener('click',()=>{DB.projects[i].img=null;save();pProjects()});
  $$('[data-mv]',row).forEach(b=>b.addEventListener('click',e=>{
   e.stopPropagation();const dir=+b.dataset.mv,j=i+dir;
   if(j<0||j>=DB.projects.length)return;
   [DB.projects[i],DB.projects[j]]=[DB.projects[j],DB.projects[i]];save();pProjects();
  }));
  $('[data-del]',row).addEventListener('click',e=>{
   e.stopPropagation();
   if(confirm('Delete "'+DB.projects[i].title+'"?')){DB.projects.splice(i,1);AP.exp=null;save();pProjects()}
  });
 });
 $('#pjAdd').addEventListener('click',()=>{
  const id=uid();
  DB.projects.push({id,title:'New Project',tagline:'',desc:'Describe this system…',long:'Full case study goes here.\n\nAdd a second paragraph after a blank line.',tech:['Python'],demo:'',live:'',img:null});
  AP.exp=id;save();pProjects();
 });
}

/* ---- skills matrix ---- */
function pSkills(){
 const cats=DB.skills.map((c,ci)=>{
  const items=c.items.map((s,si)=>'<div class="arow" style="margin-bottom:.7rem">'
   +'<input type="text" data-ci="'+ci+'" data-si="'+si+'" data-f="name" value="'+esc(s.name)+'">'
   +'<input type="range" min="0" max="100" value="'+s.pct+'" data-ci="'+ci+'" data-si="'+si+'" data-f="pct" style="--p:'+s.pct+'%">'
   +'<span class="pctOut">'+s.pct+'%</span>'
   +'<button class="icoBtn del" data-skd="'+ci+','+si+'">✕</button></div>').join('');
  return '<div class="acard"><div class="acard-hd"><input type="text" data-cn="'+ci+'" value="'+esc(c.name)+'" style="max-width:280px;font-weight:700">'
  +'<div style="display:flex;gap:.6rem"><button class="btn btn-glass sm" data-ska="'+ci+'">+ SKILL</button><button class="btn btn-danger sm" data-ckd="'+ci+'">REMOVE CATEGORY</button></div></div>'
  +items+'</div>';
 }).join('');
 $('#panel').innerHTML=cats+'<button class="btn btn-mint" id="catAdd" style="align-self:flex-start">+ ADD CATEGORY</button>';
 $$('input[data-cn]').forEach(el=>el.addEventListener('input',()=>{DB.skills[+el.dataset.cn].name=el.value;qsave()}));
 $$('input[data-f="name"]').forEach(el=>el.addEventListener('input',()=>{DB.skills[+el.dataset.ci].items[+el.dataset.si].name=el.value;qsave()}));
 $$('input[type=range]').forEach(el=>el.addEventListener('input',()=>{
  const v=+el.value;DB.skills[+el.dataset.ci].items[+el.dataset.si].pct=v;
  el.style.setProperty('--p',v+'%');el.nextElementSibling.textContent=v+'%';qsave();
 }));
 $$('[data-skd]').forEach(b=>b.addEventListener('click',()=>{const[ci,si]=b.dataset.skd.split(',').map(Number);DB.skills[ci].items.splice(si,1);save();pSkills()}));
 $$('[data-ska]').forEach(b=>b.addEventListener('click',()=>{DB.skills[+b.dataset.ska].items.push({name:'New Skill',pct:50});save();pSkills()}));
 $$('[data-ckd]').forEach(b=>b.addEventListener('click',()=>{if(confirm('Remove this category and all its skills?')){DB.skills.splice(+b.dataset.ckd,1);save();pSkills()}}));
 $('#catAdd').addEventListener('click',()=>{DB.skills.push({name:'New Category',items:[{name:'New Skill',pct:50}]});save();pSkills()});
}

/* ---- system & files ---- */
function pSystem(){
 const toggles=Object.keys(FEATURE_META).map(featRowHTML).join('');
 $('#panel').innerHTML=
 '<div class="acard"><div class="acard-hd"><h3>Feature Toggles</h3><span class="hsub">HIDE / SHOW PUBLIC SECTIONS</span></div>'+toggles+'</div>'
 +'<div class="acard"><div class="acard-hd"><h3>Resume Manager</h3><span class="hsub">POWERS THE "DOWNLOAD CV" BUTTON</span></div>'
  +(DB.resume?'<div class="prevRow" style="margin-bottom:1.1rem"><span class="mono" style="font-size:11px;color:var(--mint)">◈ '+esc(DB.resume.name)+'</span><button class="btn btn-danger sm" id="cvRm">REMOVE</button></div>':'')
  +'<div class="drop" id="cvDrop"><input type="file" accept="application/pdf" hidden><div class="drop-ic">⇪</div><div>Drop PDF resume here</div><span class="mono">MAX ~3MB · STORED LOCALLY</span></div></div>'
 +'<div class="acard"><div class="acard-hd"><h3>Security</h3><span class="hsub">ADMIN CREDENTIALS</span></div>'
  +'<div class="twoCol"><label class="frow"><span>USERNAME</span><input id="secU" value="'+esc(DB.auth.u)+'"></label>'
  +'<label class="frow"><span>NEW PASSWORD</span><input id="secP" type="password" placeholder="leave blank to keep current"></label></div>'
  +'<button class="btn btn-mint sm" id="secSave" style="margin-top:.6rem">UPDATE CREDENTIALS</button></div>';
 bindFeatureRows($('#panel'));
 bindDrop($('#cvDrop'),f=>{
  if(!f||f.type!=='application/pdf')return toast('Please drop a PDF file','err');
  readPDF(f,d=>{DB.resume=d;save();toast('Resume updated — CV button is live');pSystem()});
 });
 const rm=$('#cvRm');if(rm)rm.addEventListener('click',()=>{DB.resume=null;save();pSystem()});
 $('#secSave').addEventListener('click',()=>{
  const u=$('#secU').value.trim(),p=$('#secP').value;
  if(!u)return toast('Username cannot be empty','err');
  DB.auth.u=u;if(p)DB.auth.p=btoa(p);
  save();toast('Credentials updated');$('#secP').value='';
 });
}

/* ---- inbox ---- */
function pInbox(){
 if(!DB.inbox.length){$('#panel').innerHTML='<div class="empty">◈ INBOX ZERO — NO TRANSMISSIONS YET</div>';return}
 $('#panel').innerHTML=DB.inbox.map(m=>{
  return '<div class="msg'+(m.read?'':' unread')+'" data-id="'+m.id+'">'
  +'<div class="msgHd"><span class="ud"></span><div class="who"><b>'+esc(m.name)+'</b><small>'+esc(m.email)+'</small></div>'
  +'<time>'+new Date(m.d).toLocaleString()+'</time>'
  +'<button class="icoBtn" data-rd title="Toggle read">'+(m.read?'◌':'◉')+'</button>'
  +'<button class="icoBtn del" data-dl title="Delete">✕</button></div>'
  +'<div class="msgBd"><h5>'+esc(m.subject)+'</h5><p>'+esc(m.msg)+'</p></div></div>';
 }).join('');
 $$('.msg').forEach(el=>{
  const m=DB.inbox.find(x=>x.id===el.dataset.id);
  $('.msgHd',el).addEventListener('click',e=>{
   if(e.target.closest('button'))return;
   el.classList.toggle('open');
   if(!m.read){m.read=true;save();el.classList.remove('unread');updBadge()}
  });
  $('[data-rd]',el).addEventListener('click',()=>{m.read=!m.read;save();pInbox()});
  $('[data-dl]',el).addEventListener('click',()=>{if(confirm('Delete this message?')){DB.inbox=DB.inbox.filter(x=>x.id!==m.id);save();pInbox()}});
 });
}

/* ================================================================
   BOOT
================================================================ */
render();
setTimeout(()=>{const b=$('#boot');if(b)b.classList.add('done')},RM?50:550);
setTimeout(()=>{const b=$('#boot');if(b)b.remove()},1600);
</script>
